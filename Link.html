<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link</title>
<style>
:root{--bg:#f4f5fb;--bg2:#e9ecff;--card:#ffffffcc;--sf:#fff;--tx:#14162b;--mu:#7a7f9a;--bd:#e3e5f3;--ac:#6d5cff;--ac2:#00c2ff;--g:#22c55e;--shadow:0 6px 24px #6d5cff22;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c16;--bg2:#15122e;--card:#161829cc;--sf:#1c1f33;--tx:#eef0ff;--mu:#8b90b0;--bd:#2a2d47;--shadow:0 6px 28px #00000066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c16;--bg2:#15122e;--card:#161829cc;--sf:#1c1f33;--tx:#eef0ff;--mu:#8b90b0;--bd:#2a2d47;--shadow:0 6px 28px #00000066;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 10% -10%,var(--bg2),transparent 60%),radial-gradient(700px 500px at 100% 110%,var(--bg2),transparent 60%),var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:var(--shadow)}
.ttl{display:flex;flex-direction:column;line-height:1.1}.ttl b{font-size:18px;letter-spacing:.3px}
.st{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa0b8;display:inline-block}.dot.on{background:var(--g);box-shadow:0 0 0 3px #22c55e33}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;font-size:17px;padding:0;display:grid;place-items:center}
#strip{display:flex;gap:12px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--bd);scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.pp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);min-width:48px}
.av{position:relative;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.av.s{width:28px;height:28px;font-size:13px}.av.m{width:46px;height:46px;font-size:19px}.av.l{width:96px;height:96px;font-size:40px}
.av .dot{position:absolute;right:-1px;bottom:-1px;border:2px solid var(--bg);width:13px;height:13px}
#list{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:84%;align-self:flex-start;margin-top:8px}
.row.cont{margin-top:0}.row.me{align-self:flex-end;flex-direction:row-reverse}
.sl{width:28px;flex:none}
.col{display:flex;flex-direction:column;min-width:0}.row.me .col{align-items:flex-end}
.n{font-size:12px;color:var(--mu);margin:0 10px 2px}
.b{padding:9px 13px;border-radius:19px;background:var(--sf);border:1px solid var(--bd);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 2px #0000000d;animation:pop .18s ease-out}
.row.me .b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.row.p .b{opacity:.6}
.t{font-size:10px;color:var(--mu);margin:2px 10px 0}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#empty{margin:auto;color:var(--mu);text-align:center}
#f{display:flex;gap:8px;padding:10px 12px;background:var(--card);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
#msg,#nick{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:11px 16px;outline:0}
#msg:focus,#nick:focus{border-color:var(--ac)}
.btn{font:inherit;font-weight:600;border:0;border-radius:22px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:0 20px;cursor:pointer;min-height:44px;box-shadow:var(--shadow)}
#warn{display:none;padding:7px 12px;font-size:13px;background:var(--sf);color:var(--mu);text-align:center}
#setup{position:fixed;inset:0;background:#0008;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:26px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow)}
.card h2{margin:0}.card p{margin:0;color:var(--mu);font-size:14px;text-align:center}
.up{cursor:pointer;position:relative}.up::after{content:"📷";position:absolute;right:-2px;bottom:-2px;background:var(--sf);border:1px solid var(--bd);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.a{border-color:var(--tx)}
.card .btn{width:100%}
</style></head><body>
<header>
  <div class="logo">L</div>
  <div class="ttl"><b>Link</b><span class="st"><span class="dot" id="sd"></span><span id="stt">Connecting…</span></span></div>
  <div class="sp"></div>
  <button class="ib" id="th" title="Theme">🌓</button>
  <div id="meav" style="cursor:pointer"></div>
</header>
<div id="warn"></div>
<div id="strip"></div>
<div id="list"><div id="empty">No messages yet. Say hi 👋</div></div>
<form id="f" style="display:none"><input id="msg" autocomplete="off" maxlength="1000" placeholder="Message…"><button class="btn">Send</button></form>
<div id="setup"><div class="card">
  <h2>Join Link</h2><p>Tap the photo to add a pfp</p>
  <div class="up" id="upb"></div>
  <input type="file" accept="image/*" id="file" hidden>
  <input id="nick" maxlength="20" placeholder="Nickname">
  <div class="sw" id="sw"></div>
  <button class="btn" id="go" type="button">Let's go</button>
</div></div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const root=document.documentElement;
const COLORS=["#6d5cff","#00a8e8","#10b981","#f59e0b","#ef4444","#ec4899","#8b5cf6","#14b8a6"];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let me=null;try{me=JSON.parse(ls("me")||"null")}catch(e){}
const savedTheme=ls("theme");if(savedTheme)root.setAttribute("data-theme",savedTheme);
$("th").onclick=()=>{const dark=root.getAttribute("data-theme")?root.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const n=dark?"light":"dark";root.setAttribute("data-theme",n);ls("theme",n)};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
function av(p,size,online){
  const d=document.createElement("div");d.className="av "+size;
  const name=(p&&p.name)||"?";
  d.style.background=p&&p.pfp?"url("+p.pfp+") center/cover":(p&&p.color)||hue(name);
  if(!(p&&p.pfp))d.textContent=name[0].toUpperCase();
  if(online!==undefined){const o=document.createElement("span");o.className="dot"+(online?" on":"");d.appendChild(o)}
  return d;
}
const warn=t=>{$("warn").textContent=t;$("warn").style.display="block"};

/* setup */
let draft={name:"",color:COLORS[0],pfp:""};
function drawSetup(){
  $("upb").textContent="";$("upb").appendChild(av({name:draft.name||"?",color:draft.color,pfp:draft.pfp},"l"));
  $("sw").textContent="";
  COLORS.forEach(c=>{const i=document.createElement("i");i.style.background=c;if(c===draft.color)i.className="a";i.onclick=()=>{draft.color=c;drawSetup()};$("sw").appendChild(i)});
}
function openSetup(){draft=Object.assign({name:"",color:COLORS[0],pfp:""},me||{});$("nick").value=draft.name;drawSetup();$("setup").style.display="flex"}
$("nick").oninput=()=>{draft.name=$("nick").value;drawSetup()};
$("upb").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const c=document.createElement("canvas");c.width=c.height=96;const x=c.getContext("2d");
    const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
    draft.pfp=c.toDataURL("image/jpeg",.78);drawSetup();URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(f);
};
$("meav").onclick=openSetup;

const db=await claude.use("db");
if(!db){warn("Sign in to claude.ai to chat.");$("stt").textContent="Offline"}
const col=db&&db.collection("messages"),pcol=db&&db.collection("profiles");
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]/g,"")||"anon";
let profiles={},docs=[],room=null,peers=[];

function onlineList(){
  const m=new Map();
  if(me)m.set(me.name.toLowerCase(),me);
  peers.forEach(p=>{const x=p.presence||{};if(x.name)m.set(String(x.name).toLowerCase(),x)});
  return m;
}
function drawStrip(){
  const s=$("strip");s.textContent="";
  const on=onlineList();
  const all=new Map();
  Object.values(profiles).forEach(p=>all.set(p.name.toLowerCase(),p));
  on.forEach((p,k)=>all.set(k,p));
  [...all.entries()].sort((a,b)=>(on.has(b[0])?1:0)-(on.has(a[0])?1:0)).forEach(([k,p])=>{
    const w=document.createElement("div");w.className="pp";
    w.appendChild(av(p,"m",on.has(k)));
    const t=document.createElement("span");t.textContent=k===(me&&me.name.toLowerCase())?"You":p.name;w.appendChild(t);
    s.appendChild(w);
  });
  s.style.display=all.size?"flex":"none";
  $("stt").textContent=db?(on.size+" online"):"Offline";
}
function drawMsgs(){
  const L=$("list");const stick=L.scrollHeight-L.scrollTop-L.clientHeight<100;
  L.textContent="";
  if(!docs.length){const e=document.createElement("div");e.id="empty";e.textContent="No messages yet. Say hi 👋";L.appendChild(e);return}
  let prev=null;
  docs.forEach(d=>{
    const x=d.data()||{};const mine=me&&x.name===me.name;
    const cont=prev&&prev.name===x.name&&(x.ts-prev.ts)<120000;
    const r=document.createElement("div");
    r.className="row"+(mine?" me":"")+(cont?" cont":"")+(d.metadata.hasPendingWrites?" p":"");
    const sl=document.createElement("div");sl.className="sl";
    if(!cont&&!mine)sl.appendChild(av(profiles[slug(x.name||"")]||{name:x.name},"s"));
    if(!mine)r.appendChild(sl);
    const c=document.createElement("div");c.className="col";
    if(!cont&&!mine){const n=document.createElement("div");n.className="n";n.textContent=x.name||"Anon";c.appendChild(n)}
    const b=document.createElement("div");b.className="b";b.textContent=x.text||"";c.appendChild(b);
    r.appendChild(c);L.appendChild(r);prev=x;
  });
  if(stick||docs.some(d=>d.metadata.hasPendingWrites))L.scrollTop=L.scrollHeight;
}

async function saveMe(){
  ls("me",JSON.stringify(me));
  $("meav").textContent="";$("meav").appendChild(av(me,"s"));
  $("f").style.display="flex";
  if(pcol){try{await pcol.doc(slug(me.name)).set(me)}catch(e){}}
  if(room){try{room.presence({name:me.name,color:me.color,pfp:me.pfp||""})}catch(e){}}
  drawStrip();drawMsgs();
}
$("go").onclick=()=>{
  const n=draft.name.trim();if(!n)return;
  me={name:n,color:draft.color,pfp:draft.pfp||""};
  $("setup").style.display="none";saveMe();$("msg").focus();
};
$("setup").onclick=e=>{if(e.target.id==="setup"&&me)$("setup").style.display="none"};

if(me){saveMe()}else{openSetup()}

if(db){
  pcol.onSnapshot(s=>{profiles={};s.docs.forEach(d=>{const x=d.data();if(x&&x.name)profiles[d.id]=x});drawStrip();drawMsgs()},()=>{});
  col.orderBy("ts","asc").limit(300).onSnapshot(s=>{docs=s.docs;$("sd").className="dot on";drawMsgs();drawStrip()},e=>{$("sd").className="dot";warn("Can't load chat: "+(e.message||e.code))});
  $("f").onsubmit=async e=>{
    e.preventDefault();const t=$("msg").value.trim();if(!t||!me)return;$("msg").value="";
    try{await col.add({name:me.name,text:t,ts:Date.now()})}
    catch(err){warn("Couldn't send"+(err.code==="not_granted"?" — ask the owner for Contributor access.":"."))}
  };
}
try{
  room=await claude.use("room");
  if(room){
    if(me)room.presence({name:me.name,color:me.color,pfp:me.pfp||""});
    peers=[...room.peers()];drawStrip();
    room.onPeers(c=>{peers=[...c.peers];drawStrip()});
  }
}catch(e){}
})();
</script></body></html>
